<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Aloud</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121212;
        --text: #ffffff;
        --muted: #a7a7a7;
        --track: #1c1c1c;
        --warmed: #9e9e9e;
        --played: #ffffff;
        --error: #f15e6c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 320px;
        font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 28px 24px 24px;
      }

      .heading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
      }

      .eyebrow {
        margin: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        max-width: 100%;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        text-align: center;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .play-button {
        width: 72px;
        height: 72px;
        border: none;
        border-radius: 50%;
        background: var(--text);
        color: #000000;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 120ms ease;
      }

      .play-button:hover {
        transform: scale(1.05);
      }

      .play-button:active {
        transform: scale(0.97);
      }

      .play-button svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }

      .stop-button {
        width: 44px;
        height: 44px;
        border: 1px solid #3a3a3a;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: color 120ms ease, border-color 120ms ease, transform 120ms ease;
      }

      .stop-button:hover {
        color: var(--text);
        border-color: var(--muted);
        transform: scale(1.05);
      }

      .stop-button:active {
        transform: scale(0.96);
      }

      .stop-button svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /* Keep the play button visually centered despite the stop button. */
      .controls::after {
        content: "";
        width: 44px;
      }

      .timer {
        margin: -6px 0 0;
        font-size: 30px;
        font-weight: 300;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .timer.idle {
        color: var(--muted);
      }

      .bar {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }

      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: inherit;
        transition: width 240ms ease-out;
      }

      .bar-warmed {
        background: var(--warmed);
      }

      .bar-played {
        background: var(--played);
      }

      .error {
        margin: -10px 0 0;
        width: 100%;
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
        color: var(--error);
        word-break: break-word;
      }

      .error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="heading">
        <p class="eyebrow">Read Aloud</p>
        <h1 id="title">Read Aloud</h1>
      </div>

      <div class="controls">
        <button id="stop" class="stop-button" aria-label="Stop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7Z" />
          </svg>
        </button>
        <button id="play" class="play-button" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.68L9.54 5.98A1 1 0 0 0 8 6.82Z" />
          </svg>
        </button>
      </div>

      <p id="timer" class="timer idle">0:00</p>

      <div class="bar" aria-hidden="true">
        <div id="warmedFill" class="bar-fill bar-warmed"></div>
        <div id="playedFill" class="bar-fill bar-played"></div>
      </div>

      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
