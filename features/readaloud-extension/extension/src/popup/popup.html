<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Aloud</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121212;
        --text: #ffffff;
        --muted: #a7a7a7;
        --track: #1c1c1c;
        --warmed: #9e9e9e;
        --played: #ffffff;
        --error: #f15e6c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 320px;
        font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 28px 24px 24px;
      }

      .heading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 100%;
      }

      .eyebrow {
        margin: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        max-width: 100%;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
        text-align: center;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .play-button {
        width: 72px;
        height: 72px;
        border: none;
        border-radius: 50%;
        background: var(--text);
        color: #000000;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 120ms ease;
      }

      .play-button:hover {
        transform: scale(1.05);
      }

      .play-button:active {
        transform: scale(0.97);
      }

      .play-button svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }

      .stop-button {
        width: 44px;
        height: 44px;
        border: 1px solid #3a3a3a;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: color 120ms ease, border-color 120ms ease, transform 120ms ease;
      }

      .stop-button:hover {
        color: var(--text);
        border-color: var(--muted);
        transform: scale(1.05);
      }

      .stop-button:active {
        transform: scale(0.96);
      }

      .stop-button svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      /* Keep the play button visually centered despite the stop button. */
      .controls::after {
        content: "";
        width: 44px;
      }

      .timer {
        margin: -6px 0 0;
        font-size: 30px;
        font-weight: 300;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .timer.idle {
        color: var(--muted);
      }

      .bar {
        position: relative;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }

      .bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: inherit;
        transition: width 240ms ease-out;
      }

      .bar-warmed {
        background: var(--warmed);
      }

      .bar-played {
        background: var(--played);
      }

      .sync-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        border: 1px solid #3a3a3a;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 4px 11px;
        cursor: pointer;
        transition: color 120ms ease, border-color 120ms ease;
      }

      .sync-toggle:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      .sync-toggle[hidden] {
        display: none;
      }

      .sync-toggle .sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .sync-toggle.on,
      .sync-toggle.on:hover {
        color: #58d68d;
        border-color: rgba(88, 214, 141, 0.5);
      }

      .error {
        margin: -10px 0 0;
        width: 100%;
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
        color: var(--error);
        word-break: break-word;
      }

      .error[hidden] {
        display: none;
      }

      main[hidden] {
        display: none;
      }

      .icon-button {
        border: none;
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        padding: 6px;
        border-radius: 8px;
        cursor: pointer;
        transition: color 120ms ease, background 120ms ease;
      }

      .icon-button:hover {
        color: var(--text);
        background: #1d1d1d;
      }

      .icon-button svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      .library-toggle {
        position: absolute;
        top: 10px;
        right: 10px;
      }

      .sleep-toggle {
        position: absolute;
        top: 10px;
        left: 10px;
        display: inline-flex;
        align-items: center;
        width: auto;
        gap: 5px;
      }

      .sleep-toggle.active {
        color: #8ab4ff;
      }

      .sleep-label {
        font-size: 11px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .sleep-label[hidden] {
        display: none;
      }

      .sleep-menu {
        position: absolute;
        top: 42px;
        left: 10px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        min-width: 152px;
        padding: 6px;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        background: #1b1b1b;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      }

      .sleep-menu[hidden] {
        display: none;
      }

      .sleep-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        text-align: left;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .sleep-option:hover {
        background: #262626;
      }

      .sleep-option.selected {
        color: #8ab4ff;
      }

      .sleep-option.selected::after {
        content: "✓";
        font-size: 12px;
      }

      .player {
        position: relative;
      }

      .library {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 14px 14px 16px;
      }

      .library-header {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .library-header h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      .library-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 380px;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .story {
        border: 1px solid #242424;
        border-radius: 12px;
        background: #171717;
        overflow: hidden;
      }

      .story summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        cursor: pointer;
      }

      .story summary::-webkit-details-marker {
        display: none;
      }

      .story-caret {
        flex: none;
        width: 12px;
        height: 12px;
        fill: var(--muted);
        transition: transform 140ms ease;
      }

      .story[open] .story-caret {
        transform: rotate(90deg);
      }

      .story-cover {
        flex: none;
        width: 26px;
        height: 34px;
        border-radius: 4px;
        object-fit: cover;
        background: #222222;
      }

      .story-heading {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .story-title {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .story-summary {
        font-size: 11px;
        color: var(--muted);
      }

      .continue-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: flex-start;
        margin: 8px 12px 12px 16px;
        border: 1px solid rgba(88, 214, 141, 0.5);
        border-radius: 999px;
        background: rgba(88, 214, 141, 0.12);
        color: #58d68d;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 5px 12px;
        max-width: calc(100% - 28px);
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease;
      }

      .continue-button:hover {
        background: rgba(88, 214, 141, 0.22);
        border-color: #58d68d;
      }

      .continue-button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .continue-button svg {
        flex: none;
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      .continue-button .continue-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chapter {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px 9px 16px;
        border-top: 1px solid #222222;
      }

      .chapter-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .chapter-title {
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chapter-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
        color: var(--muted);
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .status-badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      .status-downloaded {
        color: #58d68d;
      }

      .status-processing {
        color: #f5b041;
      }

      .status-processing::before {
        animation: pulse 1.1s ease-in-out infinite;
      }

      .status-paused {
        color: #8d99ae;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      .delete-button {
        flex: none;
        border: none;
        background: transparent;
        color: var(--muted);
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
        transition: color 120ms ease, background 120ms ease;
      }

      .delete-button:hover {
        color: var(--error);
        background: rgba(241, 94, 108, 0.12);
      }

      .delete-button svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      .delete-button.confirming {
        width: auto;
        padding: 0 8px;
        color: #ffffff;
        background: var(--error);
      }

      .library-empty {
        margin: 18px 4px;
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
        color: var(--muted);
      }

      .library-empty[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="playerView" class="player">
      <button id="sleepToggle" class="icon-button sleep-toggle" aria-label="Sleep timer" title="Sleep timer" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.74 2.32a1 1 0 0 1 .26.97 7 7 0 0 0 8.71 8.71 1 1 0 0 1 1.23 1.49A9 9 0 1 1 11.25 2.1a1 1 0 0 1 1.49.22Z" />
        </svg>
        <span id="sleepLabel" class="sleep-label" hidden></span>
      </button>
      <div id="sleepMenu" class="sleep-menu" hidden role="menu">
        <button class="sleep-option" data-mode="end_of_chapter" role="menuitem">End of chapter</button>
        <button class="sleep-option" data-duration="900000" role="menuitem">15 minutes</button>
        <button class="sleep-option" data-duration="1800000" role="menuitem">30 minutes</button>
        <button class="sleep-option" data-duration="2700000" role="menuitem">45 minutes</button>
        <button class="sleep-option" data-duration="3600000" role="menuitem">60 minutes</button>
        <button class="sleep-option" data-mode="off" role="menuitem">Off</button>
      </div>
      <button id="openLibrary" class="icon-button library-toggle" aria-label="Downloads" title="Downloads">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z" />
        </svg>
      </button>
      <div class="heading">
        <p class="eyebrow">Read Aloud</p>
        <h1 id="title">Read Aloud</h1>
        <button id="syncToggle" class="sync-toggle" hidden aria-pressed="false">
          <span class="sync-dot" aria-hidden="true"></span><span id="syncLabel">Sync off</span>
        </button>
      </div>

      <div class="controls">
        <button id="stop" class="stop-button" aria-label="Stop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7Z" />
          </svg>
        </button>
        <button id="play" class="play-button" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.68L9.54 5.98A1 1 0 0 0 8 6.82Z" />
          </svg>
        </button>
      </div>

      <p id="timer" class="timer idle">0:00</p>

      <div class="bar" aria-hidden="true">
        <div id="warmedFill" class="bar-fill bar-warmed"></div>
        <div id="playedFill" class="bar-fill bar-played"></div>
      </div>

      <p id="error" class="error" hidden></p>
    </main>

    <main id="libraryView" class="library" hidden>
      <header class="library-header">
        <button id="closeLibrary" class="icon-button" aria-label="Back to player">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.7 5.3a1 1 0 0 1 0 1.4L9.42 12l5.3 5.3a1 1 0 1 1-1.42 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.42 0Z" />
          </svg>
        </button>
        <h2>Downloads</h2>
      </header>
      <div id="libraryList" class="library-list"></div>
      <p id="libraryEmpty" class="library-empty" hidden>
        No downloaded audio yet. Chapters are saved here automatically as they play, or as you read with Sync on.
      </p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
